<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal — Marlins Care Knowledge Hub</title>
  <link rel="stylesheet" href="../website/css/design-system.css">
  <link rel="stylesheet" href="css/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar Admin -->
    <aside class="admin-sidebar">
      <div class="admin-brand">
        <div class="brand-logo">⚓</div>
        <div>
          <h2 style="font-size: 16px; font-weight: 700; color: var(--text-primary);">Marlins Admin</h2>
          <span style="font-size: 11px; color: var(--color-marlins); font-weight: 600;">D1 Database Connected</span>
        </div>
      </div>

      <nav class="admin-nav">
        <a href="#playbooks" class="nav-item active">📚 Playbooks Management</a>
        <a href="#faqs" class="nav-item">💬 FAQs Management</a>
        <a href="#settings" class="nav-item">⚙️ API Gateway Settings</a>
      </nav>

      <div class="admin-status">
        <span class="status-indicator"></span>
        <span style="font-size: 12px; color: var(--text-secondary);">api.domain.com</span>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <header class="admin-header">
        <div>
          <h1 style="font-size: 22px; font-weight: 800; color: var(--text-primary);">Playbooks Management</h1>
          <p style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">Chỉnh sửa nội dung SOP, Agenda và Rubrics trên cơ sở dữ liệu Cloudflare D1</p>
        </div>
        <button id="btn-create-playbook" class="btn btn-primary">+ Tạo Playbook Mới</button>
      </header>

      <!-- Table Playbooks -->
      <section class="admin-card">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID / Title</th>
              <th>Tier</th>
              <th>Touchpoints</th>
              <th>Owner</th>
              <th>Standard Time</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="playbooks-table-body">
            <!-- Render từ JS -->
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <!-- Modal Edit Playbook -->
  <div id="modal-edit" class="modal-backdrop" style="display: none;">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 style="font-size: 18px; font-weight: 700; color: var(--text-primary);" id="modal-title">Chỉnh Sửa Playbook</h3>
        <button id="btn-close-modal" class="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <form id="playbook-form">
          <input type="hidden" id="form-id">
          
          <div class="form-group">
            <label class="form-label">Tên Playbook (Title):</label>
            <input type="text" id="form-title" class="form-control" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Phân Loại (Tier):</label>
              <select id="form-tier" class="form-control">
                <option value="Tier 1">Tier 1: High-Touch (Session Agenda + Direct)</option>
                <option value="Tier 2">Tier 2: Routine & Hybrid (Classroom Routine)</option>
                <option value="Tier 3">Tier 3: Outreach & Policy (Community & Referrals)</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Người Chịu Trách Nhiệm (Owner):</label>
              <input type="text" id="form-owner" class="form-control">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Mục Tiêu Cốt Lõi (Objective):</label>
            <textarea id="form-objective" class="form-control" rows="2"></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Thời Lượng Tiêu Chuẩn (Standard Time):</label>
              <input type="text" id="form-time" class="form-control">
            </div>
            <div class="form-group">
              <label class="form-label">Điểm Chạm (Touchpoints):</label>
              <input type="text" id="form-touchpoints" class="form-control">
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" id="btn-cancel" class="btn btn-secondary">Hủy</button>
            <button type="submit" class="btn btn-primary">Lưu Thay Đổi (Cập nhật D1)</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
