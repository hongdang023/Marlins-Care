name = "marlins-care-api"
main = "src/index.ts"
compatibility_date = "2024-03-01"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "marlins_care_db"
database_id = "xxxx-xxxx-xxxx-xxxx" # Được gán khi tạo D1 database trên Cloudflare Dashboard

[vars]
ENVIRONMENT = "production"
CORS_ORIGIN = "*"
