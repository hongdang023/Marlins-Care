<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marlins Care — Nemo12 Parent Care Knowledge Hub</title>
  <meta name="description" content="Hệ thống cơ sở tri thức, cẩm nang vận hành và tiêu chuẩn chăm sóc phụ huynh Nemo12 & Marlins Care. Triết lý: Automate the evidence. Humanize the meaning.">
  <meta name="theme-color" content="#0F766E">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Design System & Layout Stylesheets -->
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="app-container">
    
    <!-- 1. Top Navigation Bar (64px sticky) -->
    <header class="top-nav" role="banner">
      <div class="top-nav-left">
        <a href="#/overview/why-parent-care" class="brand-cluster" title="Về trang chủ">
          <div class="brand-logo-icon">M</div>
          <div class="brand-titles">
            <span class="brand-main">Marlins Care</span>
            <span class="brand-sub">Nemo12 Parent Hub</span>
          </div>
        </a>

        <!-- Search Trigger Input -->
        <button id="search-trigger-btn" class="search-trigger" type="button" aria-label="Tìm kiếm tài liệu">
          <span>🔍</span>
          <span>Tìm kiếm tài liệu...</span>
          <kbd>⌘K</kbd>
        </button>
      </div>

      <!-- Center Nav Links -->
      <nav class="top-nav-center" role="navigation" aria-label="Menu chính">
        <!-- Injected via JavaScript -->
      </nav>

      <!-- Right Controls: Theme Toggle & Mobile Button -->
      <div class="top-nav-right">
        <button id="theme-toggle-btn" class="theme-toggle-btn" type="button" aria-label="Đổi giao diện Sáng / Tối">
          🌙
        </button>
        <button id="mobile-menu-btn" class="mobile-menu-btn" type="button" aria-label="Mở menu điều hướng">
          ☰
        </button>
      </div>
    </header>

    <!-- 2. Main Layout Container (3 Columns) -->
    <div class="layout-body">
      
      <!-- Left Sidebar (280px) -->
      <aside class="left-sidebar" role="navigation" aria-label="Menu phân tầng">
        <!-- Injected via JavaScript -->
      </aside>

      <!-- Center Main Content Viewport (Max 920px) -->
      <main class="main-viewport" role="main">
        <nav id="breadcrumb-container" class="breadcrumb-nav" aria-label="Breadcrumb">
          <!-- Injected via JavaScript -->
        </nav>
        <div id="main-viewport-content">
          <!-- Dynamic Route Content Injected Here -->
        </div>
      </main>

      <!-- Right TOC Aside (240px) -->
      <aside class="right-aside" role="complementary" aria-label="Mục lục trang">
        <div class="toc-title">ON THIS PAGE</div>
        <ul id="toc-list" class="toc-list">
          <!-- Injected via JavaScript -->
        </ul>
        <button id="back-to-top-btn" class="back-to-top" type="button">
          <span>↑</span> Lên đầu trang
        </button>
      </aside>

    </div>

    <!-- 3. Search Modal Dialog (Cmd+K) -->
    <div id="search-modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Tìm kiếm">
      <div class="search-modal">
        <div class="search-modal-header">
          <span style="font-size: 18px;">🔍</span>
          <input id="modal-search-input" class="search-input" type="text" placeholder="Tìm theo tên Playbook, mã T1–T13, DAR, Jobs..." autocomplete="off">
          <button id="search-close-btn" style="color:var(--text-muted); font-size:16px; padding:4px;" aria-label="Đóng">✕</button>
        </div>
        <div id="search-results-container" class="search-results-list">
          <!-- Search results dynamically rendered -->
        </div>
      </div>
    </div>

  </div>

  <!-- Application Entry Point (ES Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
